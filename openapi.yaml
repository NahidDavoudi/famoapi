        thread_id: {type: integer}
        day: {type: string, format: date, nullable: true}
        day_jalali: {type: string, nullable: true}
        sender_role: {type: string, enum: [student, supporter, broadcast]}
        sender_account_id: {type: integer, nullable: true}
        body: {type: string, nullable: true}
        media_group_id: {type: string, nullable: true}
        is_broadcast: {type: boolean}
        read_by_student: {type: boolean}
        read_by_supporter: {type: boolean}
        created_at: {type: string, format: date-time}
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/TelegramAttachment"

    ReportThreadDay:
      type: object
      properties:
        student_id: {type: integer}
        day: {type: string, format: date}
        day_jalali: {type: string}
        weekday: {type: string}
        thread_id: {type: integer, nullable: true}
        supporter_id: {type: integer, nullable: true}
        report_submitted: {type: boolean}
        unread_replies: {type: integer}
        unread_by_supporter: {type: integer}
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ReportMessage"
        pagination:
          $ref: "#/components/schemas/Pagination"

    WeeklyDay:
      type: object
      properties:
        day: {type: string, format: date}
        day_jalali: {type: string}
        weekday: {type: string}
        state: {type: string, enum: [sent, missed, pending]}
        report_submitted: {type: boolean}
        has_reply: {type: boolean}
        reply_unread: {type: boolean}
        unread_replies: {type: integer}
        supporter_id: {type: integer, nullable: true}

    BotIdentity:
      type: object
      properties:
        role: {type: string, enum: [student, supporter]}
        account_id: {type: integer}
        name: {type: string}
        is_active: {type: boolean}
        is_linked: {type: boolean}
        linked_to_this_telegram: {type: boolean}
        linked_to_other_telegram: {type: boolean}

    TelegramLink:
      type: object
      properties:
        link_id: {type: integer}
        role: {type: string, enum: [student, supporter]}
        account_id: {type: integer}
        name: {type: string}
        is_active: {type: boolean}
        is_blocked: {type: boolean}
        telegram_user_id: {type: integer, format: int64}
        chat_id: {type: integer, format: int64}
        linked_at: {type: string, format: date-time}

    OutboxItem:
      type: object
      properties:
        id: {type: integer}
        kind: {type: string, enum: [student_report, supporter_reply, broadcast]}
        recipient_role: {type: string, enum: [student, supporter]}
        recipient_account_id: {type: integer}
        telegram_user_id: {type: integer, format: int64, nullable: true}
        chat_id: {type: integer, format: int64, nullable: true}
        attempts: {type: integer}
        max_attempts: {type: integer}
        payload:
          type: object
          properties:
            kind: {type: string}
            text: {type: string, nullable: true}
            attachments:
              type: array
              items:
                $ref: "#/components/schemas/TelegramAttachment"
            meta:
              type: object
              additionalProperties: true
        created_at: {type: string, format: date-time}

    BroadcastInput:
      type: object
      properties:
        audience: {type: string, enum: [no_report_today, all_students]}
        day: {type: string, format: date, nullable: true}
      required: [audience]

    BroadcastRecipient:
      type: object
      properties:
        student_id: {type: integer}
        name: {type: string, nullable: true}
        student_name: {type: string, nullable: true}
        grade: {type: integer, nullable: true}
        field: {type: string, nullable: true}
        status: {type: string, enum: [pending, sent, failed, blocked], nullable: true}
        telegram_message_id: {type: string, nullable: true}
        error: {type: string, nullable: true}

    BroadcastSummary:
      type: object
      properties:
        pending: {type: integer}
        sent: {type: integer}
        failed: {type: integer}
        blocked: {type: integer}

    SupportAssignment:
      type: object
      properties:
        student_id: {type: integer}
        supporter_id: {type: integer, nullable: true}
        supporter_name: {type: string, nullable: true}
        assigned_at: {type: string, format: date-time, nullable: true}

    AdminReportDay:
      type: object
      properties:
        day: {type: string, format: date}
        day_jalali: {type: string}
        weekday: {type: string}
        report_count: {type: integer}
        active_students: {type: integer}
        rate: {type: number}

    AdminSupporterPerformance:
      type: object
      properties:
        supporter_id: {type: integer}
        supporter_name: {type: string, nullable: true}
        assigned_students: {type: integer}
        report_count: {type: integer}
        threads_with_reports: {type: integer}
        threads_with_reply: {type: integer}
        reply_rate: {type: number}
        unanswered_threads: {type: integer}
        oldest_unanswered_day: {type: string, format: date, nullable: true}
        avg_first_reply_seconds: {type: integer, nullable: true}
        median_first_reply_seconds: {type: integer, nullable: true}
        messages_sent: {type: integer}
        broadcasts_sent: {type: integer}
        unread_backlog: {type: integer}

    # ──── Telegram Login (public) ────
    TelegramVerifyRequest:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Telegram user id
        auth_date:
          type: integer
          format: int64
          description: Unix timestamp of the widget authentication
        hash:
          type: string
          description: HMAC-SHA256 hash from the Telegram Login Widget
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
        photo_url:
          type: string
      required: [id, auth_date, hash]

    TelegramUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
          nullable: true
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        photo_url:
          type: string
          nullable: true

    TelegramVerifyUnlinked:
      type: object
      properties:
        linked:
          type: boolean
          enum: [false]
        ticket:
          type: string
          description: >
            Single-use, short-lived link/register ticket. Travels in the request
            body only — never in a URL.
        telegram:
          $ref: "#/components/schemas/TelegramUser"
      required: [linked, ticket, telegram]

    TelegramVerifyLinked:
      type: object
      properties:
        linked:
          type: boolean
          enum: [true]
        bot_redirect_url:
          type: string
          nullable: true
          description: >
            `TELEGRAM_BOT_URL` + `?start=linked` (null when the env var is unset;
            the page then falls back to the role panel).
      required: [linked, bot_redirect_url]

    TelegramRegisterRequest:
      type: object
      properties:
        ticket:
          type: string
          description: Ticket issued by /auth/telegram/verify
        phone:
          type: string
        password:
          type: string
          format: password
          minLength: 4
        nationalId:
          type: string
        grade:
          type: integer
          enum: [7, 8, 9, 10, 11, 12]
        field:
          type: string
          enum: [ریاضی, تجربی, انسانی, زبان, هنر, عمومی, راهنمایی]
        name:
          type: string
      required: [ticket, phone, password, nationalId, grade, field, name]

    TelegramLinkRequest:
      type: object
      properties:
        ticket:
          type: string
          description: Ticket issued by /auth/telegram/verify
        username:
          type: string
        password:
          type: string
          format: password
      required: [ticket, username, password]

    TelegramVerify2faRequest:
      type: object
      properties:
        ticket:
          type: string
        challenge_id:
          type: string
          description: Server-bound 2FA challenge nonce returned by /auth/telegram/link
        code:
          type: string
        user_id:
          type: integer
          description: >
            Not accepted as authority; if sent it must match the server-bound
            challenge user or the request is rejected.
      required: [ticket, challenge_id, code]

    TelegramLinkUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum: [student, supporter]
        student_id:
          type: integer
          nullable: true
          description: شناسه دانش‌آموز متصل (فقط برای نقش student)

    TelegramLinkResult:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/TelegramLinkUser"
        bot_redirect_url:
          type: string
          nullable: true
      required: [token, user, bot_redirect_url]

    Telegram2faChallenge:
      type: object
      properties:
        requires_2fa:
          type: boolean
          enum: [true]
        challenge_id:
          type: string
          description: Server-bound challenge nonce (no `user_id` is exposed)
        phone_mask:
          type: string
          description: Masked destination phone, e.g. 0912***89
      required: [requires_2fa, challenge_id, phone_mask]

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: VALIDATION_ERROR
              message: پارامترها ناقص است
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: AUTH_ERROR
              message: توکن نامعتبر است
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: FORBIDDEN
              message: دسترسی غیرمجاز
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: NOT_FOUND
              message: مورد نظر یافت نشد
    Conflict:
      description: Resource conflict (e.g. duplicate)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: REGISTRATION_ERROR
              message: کاربر قبلاً ثبت‌نام کرده است
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: VALIDATION_ERROR
              message: نام دانش‌آموز الزامی است
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: INTERNAL_ERROR
              message: خطای داخلی سرور
    BotUnauthorized:
      description: Missing or invalid bot service key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: BOT_UNAUTHORIZED
              message: کلید سرویس ربات نامعتبر است
    BotForbidden:
      description: Bot IP not allowed, or acting account blocked/inactive
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: BOT_ACCOUNT_BLOCKED
              message: کاربر ربات را مسدود کرده است
    ContentAccessDisabled:
      description: Content-reading permission is off for this admin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: CONTENT_ACCESS_DISABLED
              message: دسترسی به محتوای پیام‌ها فعال نیست
    RateLimited:
      description: Throttled; retry after the indicated delay
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the next allowed attempt
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: RATE_LIMITED
              message: تعداد درخواست‌ها بیش از حد مجاز است
    TelegramAuthInvalid:
      description: Widget hash invalid, or auth_date stale
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: TELEGRAM_AUTH_INVALID
              message: اطلاعات ورود تلگرام نامعتبر است
    TelegramReplay:
      description: Verified Telegram widget payload already consumed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: TELEGRAM_REPLAY
              message: این ورود قبلاً استفاده شده است
    TelegramTicketInvalid:
      description: Ticket signature/audience/purpose/TTL/consumption failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: TELEGRAM_TICKET_INVALID
              message: بلیت ورود تلگرام نامعتبر یا منقضی شده است
    TelegramLinkRoleUnsupported:
      description: Role is not student/supporter
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: TELEGRAM_LINK_ROLE_UNSUPPORTED
              message: این نقش برای اتصال به تلگرام پشتیبانی نمی‌شود

