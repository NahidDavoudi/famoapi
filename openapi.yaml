openapi: "3.1.0"
info:
  title: Famo Unified API
  description: |
    REST API for Famo Academy — unified backend serving admin panel, public site,
    dashboard, nobat booking, and planner applications.
  version: "1.0.0"
  contact:
    name: Famo Academy
    url: https://famoacademy.ir

servers:
  - url: https://api.famoacademy.ir
    description: Production server

paths:
  # ───────────────────── Health ─────────────────────
  /api/v1/health:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: healthy
                      version:
                        type: string
                        example: 1.0.0
                      time:
                        type: string
                        format: date-time
                        example: "2026-09-23 12:00:00"
                required: [success, data, pagination, error]

  # ───────────────────── Auth ─────────────────────
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: نام کاربری
                password:
                  type: string
                  description: رمز عبور
              required: [username, password]
      responses:
        "200":
          description: Login successful (student)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                          user_id:
                            type: integer
                            description: شناسه کاربر
                          email_mask:
                            type: string
                            nullable: true
                            description: ایمیل ماسک شده (در صورت فعال بودن 2FA)
                          user:
                            type: object
                            properties:
                              id:
                                type: integer
                              username:
                                type: string
                              role:
                                type: string
                                enum: [admin, supporter, student, teacher]
                              student_id:
                                type: integer
                                nullable: true
                                description: شناسه دانش‌آموز متصل (فقط برای نقش student)
        "202":
          description: 2FA required (admin/supporter)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          requires_2fa:
                            type: boolean
                            enum: [true]
                          user_id:
                            type: integer
                            description: شناسه کاربر برای مرحله دوم ورود
                          email_mask:
                            type: string
                            description: ایمیل ماسک شده کاربر
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/verify-2fa:
    post:
      tags: [Auth]
      summary: Verify 2FA code and complete login
      operationId: authVerify2fa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  description: شناسه کاربر برگشتی از مرحله اول ورود
                code:
                  type: string
                  description: کد ۶ رقمی ارسال شده به ایمیل
              required: [user_id, code]
      responses:
        "200":
          description: 2FA verified, login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                          user:
                            type: object
                            properties:
                              id:
                                type: integer
                              username:
                                type: string
                              role:
                                type: string
                                enum: [admin, supporter, student, teacher]
                              student_id:
                                type: integer
                                nullable: true
                                description: شناسه دانش‌آموز متصل (فقط برای نقش student)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Student self-registration
      operationId: authRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: شماره تلفن
                password:
                  type: string
                  format: password
                  minLength: 4
                  description: رمز عبور حساب
                nationalId:
                  type: string
                  description: کد ملی
                grade:
                  type: integer
                  description: پایه تحصیلی
                  enum: [7, 8, 9, 10, 11, 12]
                field:
                  type: string
                  description: رشته تحصیلی
                  enum: [ریاضی, تجربی, انسانی, زبان, هنر, عمومی, راهنمایی]
                name:
                  type: string
                  description: نام و نام خانوادگی
              required: [phone, password, nationalId, grade, field, name]
      responses:
        "201":
          description: Registration successful (returns a JWT — auto login)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                          user:
                            type: object
                            properties:
                              id:
                                type: integer
                              username:
                                type: string
                              role:
                                type: string
                                enum: [admin, supporter, student, teacher]
                              student_id:
                                type: integer
                                nullable: true
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current user from JWT
      operationId: authMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                          username:
                            type: string
                          full_name:
                            type: string
                            nullable: true
                          role:
                            type: string
                          student_id:
                            type: integer
                            nullable: true
                            description: شناسه دانش‌آموز متصل (null برای admin/supporter)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout (invalidate session)
      operationId: authLogout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ───────────────────── Telegram Login ─────────────────────
  # Public endpoints (no JWT, no bot service key). The Telegram flow only BINDS
  # an identity; it never grants a site session from `verify`. Tickets travel in
  # the request body only and are single-use. See §4 of the design spec.
  /api/v1/auth/telegram/verify:
    post:
      tags: [Auth]
      summary: Verify Telegram Login Widget payload (never returns a session token)
      description: >
        Offline-verifies the Telegram Login Widget payload with
        HMAC-SHA256 over the alphabetically sorted data-check-string
        (`secret_key = SHA256(bot_token)`); the API never calls Telegram.
        For an already-linked account it returns `linked: true` and the bot
        redirect only. For an unlinked account it returns `linked: false` plus a
        single-use ticket. **This endpoint NEVER returns a session token for any
        role.**
      operationId: telegramVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramVerifyRequest"
      responses:
        "200":
          description: >
            Unlinked account (issues a ticket) or already-linked account
            (returns `bot_redirect_url` only). No token is ever returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/TelegramVerifyUnlinked"
                          - $ref: "#/components/schemas/TelegramVerifyLinked"
        "401":
          $ref: "#/components/responses/TelegramAuthInvalid"
        "409":
          $ref: "#/components/responses/TelegramReplay"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/telegram/register:
    post:
      tags: [Auth]
      summary: Register a new student with a Telegram ticket and link the account
      description: >
        Creates `users` + `students`, inserts the `telegram_links` row
        (`role=student`), atomically consumes the ticket, and returns a JWT.
        Validation is identical to `POST /api/v1/auth/register`.
      operationId: telegramRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramRegisterRequest"
      responses:
        "201":
          description: Registration successful and Telegram account linked (returns a JWT)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/TelegramLinkResult"
        "401":
          $ref: "#/components/responses/TelegramTicketInvalid"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/telegram/link:
    post:
      tags: [Auth]
      summary: Link an existing account using a Telegram ticket
      description: >
        Authenticates `username`/`password` and links the Telegram account.
        Students receive a JWT immediately. Supporters require 2FA: the link row
        is created only after a successful code; the ticket is validated but not
        consumed until `/verify-2fa`. Errors before successful authentication are
        generic (`AUTH_ERROR`).
      operationId: telegramLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramLinkRequest"
      responses:
        "200":
          description: Student linked successfully (returns a JWT)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/TelegramLinkResult"
        "202":
          description: Supporter authenticated — 2FA required (no token, no link yet)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Telegram2faChallenge"
        "401":
          description: >
            Generic auth failure (`AUTH_ERROR`) or invalid/expired ticket
            (`TELEGRAM_TICKET_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                auth_error:
                  value:
                    success: false
                    data: null
                    pagination: null
                    error:
                      code: AUTH_ERROR
                      message: نام کاربری یا رمز عبور اشتباه است
                ticket_invalid:
                  value:
                    success: false
                    data: null
                    pagination: null
                    error:
                      code: TELEGRAM_TICKET_INVALID
                      message: بلیت ورود تلگرام نامعتبر یا منقضی شده است
        "403":
          $ref: "#/components/responses/TelegramLinkRoleUnsupported"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/telegram/verify-2fa:
    post:
      tags: [Auth]
      summary: Verify the Telegram-flow 2FA code and complete linking
      description: >
        Verifies `code` against the server-bound challenge, inserts the
        `role=supporter` link, consumes ticket + challenge, and returns a JWT.
        `user_id` is **not** accepted as authority; if sent it must match the
        server-bound challenge user.
      operationId: telegramVerify2fa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramVerify2faRequest"
      responses:
        "200":
          description: 2FA verified, supporter linked (returns a JWT)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/TelegramLinkResult"
        "401":
          description: >
            Invalid/expired 2FA code (`2FA_ERROR`) or invalid/expired ticket
            (`TELEGRAM_TICKET_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                twofa_error:
                  value:
                    success: false
                    data: null
                    pagination: null
                    error:
                      code: 2FA_ERROR
                      message: کد تأیید نامعتبر یا منقضی شده است
                ticket_invalid:
                  value:
                    success: false
                    data: null
                    pagination: null
                    error:
                      code: TELEGRAM_TICKET_INVALID
                      message: بلیت ورود تلگرام نامعتبر یا منقضی شده است
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ───────────────────── Public ─────────────────────
  /api/v1/public/courses:
    get:
      tags: [Public]
      summary: Get published courses with features
      operationId: publicGetCourses
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Course"

  /api/v1/public/instructors:
    get:
      tags: [Public]
      summary: Get published instructors with social links
      operationId: publicGetInstructors
      responses:
        "200":
          description: List of instructors
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Instructor"

  /api/v1/public/supporters:
    get:
      tags: [Public]
      summary: Get supporters list
      operationId: publicGetSupporters
      responses:
        "200":
          description: List of supporters
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Supporter"

  /api/v1/public/blog/posts:
    get:
      tags: [Public, Blog]
      summary: Get published blog posts (paginated)
      operationId: publicGetBlogPosts
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated published posts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          posts:
                            type: array
                            items:
                              $ref: "#/components/schemas/BlogPost"
                  - $ref: "#/components/schemas/WithPagination"

  /api/v1/public/blog/posts/{slug}:
    get:
      tags: [Public, Blog]
      summary: Get single published post by slug
      operationId: publicGetBlogPostBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Post found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          post:
                            $ref: "#/components/schemas/BlogPost"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/public/blog/categories:
    get:
      tags: [Public, Blog]
      summary: Get active blog categories
      operationId: publicGetBlogCategories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/BlogCategory"

  /api/v1/public/blog/categories/{category}/posts:
    get:
      tags: [Public, Blog]
      summary: Get published posts by category slug
      operationId: publicGetBlogPostsByCategory
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated posts in category
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          posts:
                            type: array
                            items:
                              $ref: "#/components/schemas/BlogPost"
                  - $ref: "#/components/schemas/WithPagination"

  # ───────────────────── Dashboard ─────────────────────
  /api/v1/dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Get dashboard statistics (supporter+)
      operationId: dashboardStats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          students_count:
                            type: integer
                            description: کل دانش‌آموزان
                          exams_this_week:
                            type: integer
                            description: تعداد آزمون‌های این هفته
                          students_no_exam:
                            type: integer
                            description: دانش‌آموزان بدون آزمون
                          pending_reports:
                            type: integer
                            description: گزارش‌های در انتظار
                          avg_by_field:
                            type: array
                            description: میانگین درصد به تفکیک رشته
                            items:
                              type: object
                              properties:
                                field:
                                  type: string
                                avg_percentage:
                                  type: number
                                student_count:
                                  type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ───────────────────── Blog (protected) ─────────────────────
  /api/v1/blog/posts:
    get:
      tags: [Blog]
      summary: Get all blog posts (including drafts)
      operationId: blogGetAllPosts
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated posts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          posts:
                            type: array
                            items:
                              $ref: "#/components/schemas/BlogPost"
                  - $ref: "#/components/schemas/WithPagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Blog]
      summary: Create blog post (admin only)
      operationId: blogCreatePost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                slug:
                  type: string
                excerpt:
                  type: string
                content:
                  type: string
                cover_image:
                  type: string
                category_id:
                  type: integer
                published:
                  type: boolean
              required: [title, content]
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/BlogPost"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/blog/posts/{id}:
    get:
      tags: [Blog]
      summary: Get blog post by ID
      operationId: blogGetPostById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          post:
                            $ref: "#/components/schemas/BlogPost"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Blog]
      summary: Update blog post (admin only)
      operationId: blogUpdatePost
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                slug:
                  type: string
                excerpt:
                  type: string
                content:
                  type: string
                cover_image:
                  type: string
                category_id:
                  type: integer
                published:
                  type: boolean
      responses:
        "200":
          description: Post updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/BlogPost"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Blog]
      summary: Delete blog post (admin only)
      operationId: blogDeletePost
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ───────────────────── Students ─────────────────────
  /api/v1/students/list:
    get:
      tags: [Students]
      summary: Get simple list of all students
      operationId: studentGetList
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Students list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Student"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/students/overview:
    get:
      tags: [Students]
      summary: Students with planner stats (admin)
      description: >-
        Student list enriched with plan_count, total_events and
        last_week_date. Temporary admin-only while the planner is migrated.
      operationId: studentOverview
      security:
        - bearerAuth: []
      responses:
