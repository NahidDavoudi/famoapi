  # ───────────────────── Broadcasts ─────────────────────
  /api/v1/bot/broadcasts/preview:
    post:
      tags: [Broadcasts]
      summary: Preview broadcast recipients (no writes)
      operationId: botBroadcastPreview
      security:
        - botKey: []
      parameters:
        - $ref: "#/components/parameters/BotRole"
        - $ref: "#/components/parameters/TelegramUserId"
        - $ref: "#/components/parameters/TelegramChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastInput"
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          audience:
                            type: string
                            enum: [no_report_today, all_students]
                          day:
                            type: string
                            format: date
                          day_jalali:
                            type: string
                          recipient_count:
                            type: integer
                          recipients:
                            type: array
                            items:
                              $ref: "#/components/schemas/BroadcastRecipient"
                          daily_limit:
                            type: integer
                          used_today:
                            type: integer
                          remaining_today:
                            type: integer
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/BotForbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/bot/broadcasts/confirm:
    post:
      tags: [Broadcasts]
      summary: Confirm broadcast (freezes recipients, queues one outbox item each)
      operationId: botBroadcastConfirm
      security:
        - botKey: []
      parameters:
        - $ref: "#/components/parameters/BotRole"
        - $ref: "#/components/parameters/TelegramUserId"
        - $ref: "#/components/parameters/TelegramChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/BroadcastInput"
                - $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Broadcast created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          broadcast_id:
                            type: integer
                          audience:
                            type: string
                          day:
                            type: string
                            format: date
                          day_jalali:
                            type: string
                          recipient_count:
                            type: integer
                          enqueued:
                            type: integer
                          blocked:
                            type: integer
                          failed:
                            type: integer
                          summary:
                            $ref: "#/components/schemas/BroadcastSummary"
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/BotForbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Supporter broadcast daily limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

