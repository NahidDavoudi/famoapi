  # ───────────────────── Outbox ─────────────────────
  /api/v1/bot/outbox/claim:
    post:
      tags: [Outbox]
      summary: Claim a batch of pending outbox items (locked to the worker)
      operationId: botOutboxClaim
      security:
        - botKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  default: 10
                  minimum: 1
                  maximum: 50
                worker_id:
                  type: string
                  description: Optional; generated when omitted
      responses:
        "200":
          description: Claimed items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          worker_id:
                            type: string
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/OutboxItem"
        "401":
          $ref: "#/components/responses/BotUnauthorized"

  /api/v1/bot/outbox/report:
    post:
      tags: [Outbox]
      summary: Report delivery results for claimed items
      operationId: botOutboxReport
      security:
        - botKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                worker_id:
                  type: string
                results:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                      status:
                        type: string
                        enum: [sent, failed, blocked]
                      telegram_message_id:
                        type: string
                      error:
                        type: string
                    required: [id, status]
              required: [worker_id, results]
      responses:
        "200":
          description: Per-item results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          processed:
                            type: integer
                          results:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                result:
                                  type: string
                                  enum: [sent, retry, failed, blocked, ignored]
                                attempts:
                                  type: integer
                                next_attempt_in:
                                  type: integer
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

