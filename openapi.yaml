  # ───────────────────── Exams ─────────────────────
  /api/v1/exams:
    get:
      tags: [Exams]
      summary: List exam results (filterable, paginated)
      operationId: examGetAll
      security:
        - bearerAuth: []
      parameters:
        - name: student_id
          in: query
          schema:
            type: integer
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/Page"
        - name: per_page
          in: query
          schema:
            type: integer
            default: 200
      responses:
        "200":
          description: Paginated exam results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          exams:
                            type: array
                            items:
                              $ref: "#/components/schemas/ExamResultListItem"
                  - $ref: "#/components/schemas/WithPagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Exams]
      summary: Bulk save exam results (admin only)
      operationId: examSave
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                student_id:
                  type: integer
                exam_date:
                  type: string
                  format: date
                subjects:
                  type: array
                  items:
                    type: object
                    properties:
                      subject:
                        type: string
                      chapter:
                        type: string
                      total_q:
                        type: integer
                        description: تعداد کل سوالات
                      correct:
                        type: integer
                      wrong:
                        type: integer
                      skipped:
                        type: integer
                    required: [subject, total_q]
              required: [student_id, exam_date, subjects]
      responses:
        "200":
          description: Exam results saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          inserted:
                            type: integer
                            description: تعداد نتایج ذخیره‌شده
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/exams/dates:
    get:
      tags: [Exams]
      summary: Get distinct exam dates with stats
      operationId: examGetDates
      description: |
        Distinct exam dates with aggregate stats. Students are automatically
        scoped to their own results (a `student_id` different from the token's
        linked student returns 403).
      security:
        - bearerAuth: []
      parameters:
        - name: student_id
          in: query
          required: false
          schema:
            type: integer
          description: محدود کردن به تاریخ‌های یک دانش‌آموز (برای شاگرد خودکار تحمیل می‌شود)
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Exam dates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          dates:
                            type: array
                            items:
                              type: object
                              properties:
                                exam_date:
                                  type: string
                                  format: date
                                student_count:
                                  type: integer
                                subject_count:
                                  type: integer
                                avg_percentage:
                                  type: number
                  - $ref: "#/components/schemas/WithPagination"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/exams/students:
    get:
      tags: [Exams]
      summary: Get students for a specific exam date (supporter+)
      operationId: examGetStudents
      description: Staff-only listing of all students who took an exam on a date.
      security:
        - bearerAuth: []
      parameters:
        - name: exam_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Students for exam date
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          students:
                            type: array
                            items:
                              type: object
                              properties:
                                student_id:
                                  type: integer
                                name:
                                  type: string
                                grade:
                                  type: integer
                                field:
                                  type: string
                                subject_count:
                                  type: integer
                                avg_percentage:
                                  type: number
                  - $ref: "#/components/schemas/WithPagination"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/exams/details:
    get:
      tags: [Exams]
      summary: Get per-subject breakdown for a student on a date
      operationId: examGetDetails
      description: |
        Per-subject breakdown for one student on one exam date. Students may
        only query their own `student_id` (otherwise 403); staff can query any.
      security:
        - bearerAuth: []
      parameters:
        - name: exam_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: student_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Exam subject breakdown
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          student:
                            type: object
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                              grade:
                                type: integer
                              field:
                                type: string
                          subjects:
                            type: array
                            items:
                              type: object
                              properties:
                                subject:
                                  type: string
                                chapter:
                                  type: string
                                  nullable: true
                                total_q:
                                  type: integer
                                correct:
                                  type: integer
                                wrong:
                                  type: integer
                                skipped:
                                  type: integer
                                percentage:
                                  type: number
                          avg_percentage:
                            type: number
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

