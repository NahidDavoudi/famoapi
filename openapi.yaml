components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from POST /api/v1/auth/login

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
      description: Items per page
    PerPageAlt:
      name: perPage
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
      description: Items per page (alternate casing)

  schemas:
    # ──── Envelope ────
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          nullable: true
        pagination:
          anyOf:
            - $ref: "#/components/schemas/Pagination"
            - type: "null"
        error:
          type: "null"
      required: [success, data, pagination, error]

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [false]
        data:
          type: "null"
        pagination:
          type: "null"
        error:
          type: object
          properties:
            code:
              type: string
              description: Error code (machine-readable)
            message:
              type: string
              description: Human-readable error message in Persian
          required: [code, message]
      required: [success, data, pagination, error]

    Pagination:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      required: [page, per_page, total, total_pages]

    WithPagination:
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ──── Domain Models ────
    Student:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        grade:
          type: integer
        field:
          type: string
        national_id:
          type: string
        status:
          type: integer
          enum: [0, 1]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Course:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        icon:
          type: string
          nullable: true
        gradient_color_from:
          type: string
          nullable: true
        gradient_color_to:
          type: string
          nullable: true
        background_image_url:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        full_description:
          type: string
          nullable: true
        target_grades:
          type: string
          nullable: true
        format:
          type: string
          nullable: true
        badge_label:
          type: string
          nullable: true
        price:
          type: integer
        display_order:
          type: integer
        features:
          type: array
          items:
            type: string
          description: Array of feature text strings
        created_at:
          type: string
          format: date-time

    Instructor:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        full_bio:
          type: string
          nullable: true
        image_url:
