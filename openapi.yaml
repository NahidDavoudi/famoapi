  # ───────────────────── Appointments ─────────────────────
  /api/v1/appointments:
    get:
      tags: [Appointments]
      summary: List appointments (supporter+)
      operationId: appointmentList
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated appointments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Appointment"
                  - $ref: "#/components/schemas/WithPagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Appointments]
      summary: Create appointment (supporter+)
      operationId: appointmentCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                student_id:
                  type: integer
                appointment_date:
                  type: string
                  format: date
                start_time:
                  type: string
                  description: e.g. 14:00
                end_time:
                  type: string
                  description: e.g. 14:30
                type:
                  type: string
                description:
                  type: string
              required: [student_id, appointment_date, start_time, end_time]
      responses:
        "201":
          description: Appointment created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Appointment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/appointments/{id}/status:
    put:
      tags: [Appointments]
      summary: Update appointment status (supporter+)
      operationId: appointmentUpdateStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, confirmed, completed, cancelled]
              required: [status]
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Appointment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/appointments/{id}:
    delete:
      tags: [Appointments]
      summary: Delete appointment (supporter+)
      operationId: appointmentDelete
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Appointment deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  # ───────────────────── Daily Attendance ─────────────────────
  /api/v1/attendance:
    get:
      tags: [DailyAttendance]
      summary: List the attendance board for a Tehran day
      operationId: attendanceList
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Tehran (Jalali-backed) date; defaults to today
        - name: field
          in: query
          required: false
          schema:
            type: string
          description: Filter by student field/رشته
      responses:
        "200":
          description: Attendance day with entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/AttendanceDay"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/attendance/entries:
    put:
      tags: [DailyAttendance]
      summary: Create or update a attendance entry for a student
      operationId: attendanceUpsertEntry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                student_id:
                  type: integer
                status:
                  type: string
                  enum: [present, absent]
                removed:
                  type: boolean
                client_uuid:
                  type: string
                  nullable: true
                  description: Idempotency key
              required: [date, student_id]
      responses:
        "200":
          description: Entry saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/AttendanceEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/attendance/{id}/times:
    patch:
      tags: [DailyAttendance]
      summary: Set one timestamp column of an attendance entry
      operationId: attendanceSetTime
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                field:
                  type: string
                  enum: [arrived_at, exam_started_at, exam_ended_at, departed_at]
                value:
                  type: string
                  nullable: true
                  description: Timestamp string, "now", or null/empty to clear
              required: [field]
      responses:
        "200":
          description: Entry updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/AttendanceEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/attendance/guests:
    post:
      tags: [DailyAttendance]
      summary: Add a guest attendance row
      operationId: attendanceAddGuest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                guest_name:
                  type: string
                field:
                  type: string
              required: [date, guest_name, field]
      responses:
        "201":
          description: Guest created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/AttendanceEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/attendance/print:
    get:
      tags: [DailyAttendance]
      summary: Attendance day for printing (timestamp columns omitted)
      operationId: attendancePrint
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: field
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Attendance day with entries (no *_at keys)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/AttendanceDay"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ───────────────────── Tutoring ─────────────────────
  /api/v1/tutoring/me:
    get:
      tags: [Tutoring]
      summary: Current teacher classroom, status and open session
      operationId: tutoringMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tutoring state for the caller
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          classroom:
                            $ref: "#/components/schemas/TutoringClassroom"
                          status:
                            type: object
                            nullable: true
                            properties:
                              status:
                                type: string
                                enum: [absent, ready, break]
                              started_at:
                                type: string
                                format: date-time
                              status_date:
                                type: string
                                format: date
                          open_session:
                            allOf:
                              - $ref: "#/components/schemas/TutoringSession"
                              - nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/tutoring/status:
    put:
      tags: [Tutoring]
      summary: Change the teacher's current status
      operationId: tutoringSetStatus
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [absent, ready, break]
              required: [status]
      responses:
        "200":
          description: Status changed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/TutoringStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/tutoring/students:
    get:
      tags: [Tutoring]
      summary: Search active students by name/phone
      operationId: tutoringStudents
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Name or phone fragment
      responses:
        "200":
          description: Matching students
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            grade:
                              type: integer
                              nullable: true
                            field:
                              type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/tutoring/sessions:
    post:
      tags: [Tutoring]
      summary: Start a tutoring session
      operationId: tutoringStartSession
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                student_id:
                  type: integer
                client_uuid:
                  type: string
                  nullable: true
                  description: Idempotency key
                entered_at:
                  type: string
                  format: date-time
                  nullable: true
              required: [student_id]
      responses:
        "200":
          description: Existing session returned (idempotent client_uuid)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/TutoringSession"
        "201":
          description: Session created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/TutoringSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/tutoring/sessions/{id}/end:
    post:
      tags: [Tutoring]
      summary: End an open tutoring session
      operationId: tutoringEndSession
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ended_at:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/TutoringSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/tutoring/board:
    get:
      tags: [Tutoring]
      summary: Live tutoring board across active classrooms
      operationId: tutoringBoard
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Only return classrooms active at/after this timestamp
      responses:
        "200":
          description: Board rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/TutoringBoardClass"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ───────────────────── Bot Gateway ─────────────────────
  /api/v1/bot/ping:
    get:
      tags: [Bot]
      summary: Bot gateway health check
      operationId: botPing
      security:
        - botKey: []
      responses:
        "200":
          description: Gateway reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/BotUnauthorized"

  /api/v1/bot/me:
    get:
      tags: [Bot]
      summary: Resolve the acting account for the given Telegram identity
      operationId: botMe
      security:
        - botKey: []
      parameters:
        - $ref: "#/components/parameters/BotRole"
        - $ref: "#/components/parameters/TelegramUserId"
        - $ref: "#/components/parameters/TelegramChatId"
      responses:
        "200":
          description: Acting account
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          role:
                            type: string
                            enum: [student, supporter]
                          account_id:
                            type: integer
                          name:
                            type: string
                          telegram_user_id:
                            type: integer
                            format: int64
                          chat_id:
                            type: integer
                            format: int64
                          is_blocked:
                            type: boolean
                          linked_at:
                            type: string
                            format: date-time
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/BotForbidden"

  # ───────────────────── Bot Identity & Linking ─────────────────────
  /api/v1/bot/identity/lookup:
    post:
      tags: [BotIdentity]
      summary: Look up all roles for a phone number
      operationId: botIdentityLookup
      security:
        - botKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: Persian/Arabic digits and +98/98/0098/09 forms accepted
                telegram_user_id:
                  type: integer
                  format: int64
                  description: Optional, to report existing link state
              required: [phone]
      responses:
        "200":
          description: Matching identities
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          phone:
                            type: string
                          identities:
                            type: array
                            items:
                              $ref: "#/components/schemas/BotIdentity"
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/bot/identity/link:
    post:
      tags: [BotIdentity]
      summary: Link a Telegram user/chat to an account (contact already verified by the bot host)
      operationId: botIdentityLink
      security:
        - botKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                telegram_user_id:
                  type: integer
                  format: int64
                chat_id:
                  type: integer
                  format: int64
                role:
                  type: string
                  enum: [student, supporter]
                account_id:
                  type: integer
                contact_verified:
                  type: boolean
                  description: Must be true; the bot host proves contact ownership
              required: [telegram_user_id, chat_id, role, account_id, contact_verified]
      responses:
        "200":
          description: Link created or refreshed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/TelegramLink"
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/BotForbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/bot/identity/resolve:
    get:
      tags: [BotIdentity]
      summary: Resolve link(s) by telegram_user_id or chat_id
      operationId: botIdentityResolve
      security:
        - botKey: []
      parameters:
        - name: telegram_user_id
          in: query
          schema:
            type: integer
            format: int64
        - name: chat_id
          in: query
          schema:
            type: integer
            format: int64
        - name: role
          in: query
          schema:
            type: string
            enum: [student, supporter]
      responses:
        "200":
          description: Matching links
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          links:
                            type: array
                            items:
                              $ref: "#/components/schemas/TelegramLink"
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/bot/identity/unlink:
    post:
      tags: [BotIdentity]
      summary: Remove a Telegram link
      operationId: botIdentityUnlink
      security:
        - botKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                telegram_user_id:
                  type: integer
                  format: int64
                role:
                  type: string
                  enum: [student, supporter]
                account_id:
                  type: integer
                  description: Alternative to telegram_user_id (requires role)
      responses:
        "200":
          description: Unlink result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          unlinked:
                            type: integer
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/bot/identity/block:
    post:
      tags: [BotIdentity]
      summary: Mark a Telegram link as blocked
      operationId: botIdentityBlock
      security:
        - botKey: []
      requestBody:
        $ref: "#/components/requestBodies/BotBlockRequest"
      responses:
        "200":
          description: Block result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          blocked:
                            type: boolean
                          affected:
                            type: integer
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/bot/identity/unblock:
    post:
      tags: [BotIdentity]
      summary: Clear the blocked flag on a Telegram link
      operationId: botIdentityUnblock
      security:
        - botKey: []
      requestBody:
        $ref: "#/components/requestBodies/BotBlockRequest"
      responses:
        "200":
          description: Unblock result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          blocked:
                            type: boolean
                          affected:
                            type: integer
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ───────────────────── Threads & Messages ─────────────────────
  /api/v1/bot/threads/messages:
    post:
      tags: [Threads]
      summary: Student sends a message (with optional attachments) to today's thread
      operationId: botThreadSendMessage
      security:
        - botKey: []
      parameters:
        - $ref: "#/components/parameters/BotRole"
        - $ref: "#/components/parameters/TelegramUserId"
        - $ref: "#/components/parameters/TelegramChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message stored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/ReportMessage"
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/BotForbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/bot/threads/day:
    get:
      tags: [Threads]
      summary: Get a day's thread with paginated messages
      operationId: botThreadDay
      security:
        - botKey: []
      parameters:
        - $ref: "#/components/parameters/BotRole"
        - $ref: "#/components/parameters/TelegramUserId"
        - $ref: "#/components/parameters/TelegramChatId"
        - name: day
