        "200":
          description: Students without recent reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/stats/supporters/performance:
    get:
      tags: [AdminStats]
      summary: Per-supporter performance metrics (admin)
      operationId: adminStatsSupporterPerformance
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: Performance
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          from:
                            type: string
                            format: date
                          to:
                            type: string
                            format: date
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/AdminSupporterPerformance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/stats/students/{id}/history:
    get:
      tags: [AdminStats]
      summary: Drill-down daily history for a student (admin, stats-only)
      operationId: adminStatsStudentHistory
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: History
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/stats/students/{id}/thread:
    get:
      tags: [AdminStats]
      summary: Read a student's day thread content (admin, separate content permission; off by default)
      operationId: adminStatsStudentThread
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: day
          in: query
          schema:
            type: string
            format: date
          description: Tehran date (defaults to today)
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPageAlt"
      responses:
        "200":
          description: Thread content
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          student:
                            type: object
                          day:
                            type: string
                            format: date
                          day_jalali:
                            type: string
                          thread_id:
                            type: integer
                            nullable: true
                          messages:
                            type: array
                            items:
                              $ref: "#/components/schemas/ReportMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ContentAccessDisabled"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from POST /api/v1/auth/login
    botKey:
      type: apiKey
      in: header
      name: X-Bot-Key
      description: >
        Service key for the external Telegram bot host. Grants access only to
        /api/v1/bot/* endpoints. Completely separate from bearerAuth. An optional
        IP allow-list (BOT_IP_ALLOWLIST) may further restrict callers.

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
      description: Items per page
    PerPageAlt:
      name: perPage
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
      description: Items per page (alternate casing)
    BotRole:
      name: X-Bot-Role
      in: header
      required: true
      schema:
        type: string
        enum: [student, supporter]
      description: Acting role for the linked Telegram account
    TelegramUserId:
      name: X-Telegram-User-Id
      in: header
      required: true
      schema:
        type: string
      description: Telegram numeric user id
    TelegramChatId:
      name: X-Telegram-Chat-Id
      in: header
      required: true
      schema:
        type: string
      description: Telegram numeric chat id (must match the stored link)
    StudentIdPath:
      name: studentId
      in: path
      required: true
      schema:
        type: integer
      description: Student id
    DateFrom:
      name: from
      in: query
      schema:
        type: string
        format: date
      description: Start Tehran date (inclusive)
    DateTo:
      name: to
      in: query
      schema:
        type: string
        format: date
      description: End Tehran date (inclusive)

  requestBodies:
    BotBlockRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              telegram_user_id:
                type: integer
                format: int64
              chat_id:
                type: integer
                format: int64
              role:
                type: string
                enum: [student, supporter]
            description: Provide telegram_user_id (optionally with role) or chat_id

  schemas:
    # ──── Envelope ────
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          nullable: true
        pagination:
          anyOf:
            - $ref: "#/components/schemas/Pagination"
            - type: "null"
        error:
          type: "null"
      required: [success, data, pagination, error]

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [false]
        data:
          type: "null"
        pagination:
          type: "null"
        error:
          type: object
          properties:
            code:
              type: string
              description: Error code (machine-readable)
            message:
              type: string
              description: Human-readable error message in Persian
          required: [code, message]
      required: [success, data, pagination, error]

    Pagination:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      required: [page, per_page, total, total_pages]

    WithPagination:
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ──── Domain Models ────
    Student:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        grade:
          type: integer
        field:
          type: string
        national_id:
          type: string
        status:
          type: integer
          enum: [0, 1]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ParentContact:
      type: object
      properties:
        id:
          type: integer
        student_id:
          type: integer
        parent_name:
          type: string
        relationship:
          type: string
          enum: [father, mother, guardian, other]
        phone:
          type: string
          maxLength: 15
        is_primary:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, student_id, parent_name, relationship, phone, is_primary]

    ParentContactInput:
      type: object
      properties:
        parent_name:
          type: string
