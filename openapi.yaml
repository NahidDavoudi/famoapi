  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: VALIDATION_ERROR
              message: پارامترها ناقص است
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: AUTH_ERROR
              message: توکن نامعتبر است
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: FORBIDDEN
              message: دسترسی غیرمجاز
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: NOT_FOUND
              message: مورد نظر یافت نشد
    Conflict:
      description: Resource conflict (e.g. duplicate)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: REGISTRATION_ERROR
              message: کاربر قبلاً ثبت‌نام کرده است
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: VALIDATION_ERROR
              message: نام دانش‌آموز الزامی است
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: INTERNAL_ERROR
              message: خطای داخلی سرور

